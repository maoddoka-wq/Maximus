openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: stock
    description: Stock management operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /stock/bootstrap:
    get:
      operationId: getStockBootstrap
      tags: [stock]
      summary: Load the stock workspace
      parameters:
        - name: companyId
          in: query
          required: false
          schema:
            type: string
            default: kora
      responses:
        "200":
          description: Stock workspace data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockBootstrap"
  /stock/products:
    post:
      operationId: createStockProduct
      tags: [stock]
      summary: Create a stock product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockProduct"
  /stock/products/{id}:
    patch:
      operationId: updateStockProduct
      tags: [stock]
      summary: Update a stock product
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockProductInput"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockProduct"
    delete:
      operationId: archiveStockProduct
      tags: [stock]
      summary: Archive a stock product
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Product archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockProduct"
  /stock/movements:
    post:
      operationId: createStockMovement
      tags: [stock]
      summary: Validate a stock movement atomically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockMovementInput"
      responses:
        "201":
          description: Movement validated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovement"
        "409":
          description: Insufficient stock
  /stock/inventories:
    post:
      operationId: createStockInventory
      tags: [stock]
      summary: Create a stock inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockInventoryInput"
      responses:
        "201":
          description: Inventory created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockInventory"
  /stock/inventories/{id}/validate:
    post:
      operationId: validateStockInventory
      tags: [stock]
      summary: Validate inventory and apply differences
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Inventory validated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockInventory"
components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StockProduct:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        companyId: { type: string }
        name: { type: string }
        sku: { type: string }
      required: [id, companyId, name, sku]
    StockProductInput:
      type: object
      additionalProperties: true
      properties:
        companyId: { type: string }
        name: { type: string }
        sku: { type: string }
      required: [name, sku]
    StockMovement:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        companyId: { type: string }
        productId: { type: string }
        warehouseId: { type: string }
        type: { type: string }
        quantity: { type: integer }
      required: [id, companyId, productId, warehouseId, type, quantity]
    StockMovementInput:
      type: object
      additionalProperties: true
      properties:
        companyId: { type: string }
        productId: { type: string }
        warehouseId: { type: string }
        type: { type: string }
        quantity: { type: integer, minimum: 1 }
      required: [productId, warehouseId, type, quantity]
    StockInventory:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        companyId: { type: string }
        warehouseId: { type: string }
        status: { type: string }
      required: [id, companyId, warehouseId, status]
    StockInventoryInput:
      type: object
      additionalProperties: true
      properties:
        companyId: { type: string }
        warehouseId: { type: string }
        notes: { type: string }
        lines:
          type: array
          items:
            type: object
            required: [productId, actualQuantity]
            properties:
              productId: { type: string }
              actualQuantity: { type: integer, minimum: 0 }
      required: [warehouseId, lines]
    StockBootstrap:
      type: object
      additionalProperties: true
      properties:
        products: { type: array, items: { $ref: "#/components/schemas/StockProduct" } }
        warehouses: { type: array, items: { type: object, additionalProperties: true } }
        locations: { type: array, items: { type: object, additionalProperties: true } }
        suppliers: { type: array, items: { type: object, additionalProperties: true } }
        balances: { type: array, items: { type: object, additionalProperties: true } }
        movements: { type: array, items: { $ref: "#/components/schemas/StockMovement" } }
        inventories: { type: array, items: { $ref: "#/components/schemas/StockInventory" } }
        inventoryLines: { type: array, items: { type: object, additionalProperties: true } }
      required: [products, warehouses, locations, suppliers, balances, movements, inventories, inventoryLines]

