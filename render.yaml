services:
  - type: web
    name: maximus-erp
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    plan: free
    healthCheckPath: /api/healthz
    autoDeploy: false
    preDeployCommand: >-
      php artisan migrate --force --no-interaction
      && php artisan maximus:provision-admin --no-interaction
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: maximus-postgres
          property: connectionString
      - key: DB_CONNECTION
        value: pgsql
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning

databases:
  - name: maximus-postgres
    plan: free
    databaseName: maximus
    user: maximus