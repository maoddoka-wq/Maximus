services:
  - type: web
    name: maximus-erp
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    plan: free
    healthCheckPath: /api/healthz
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: maximus-postgres
          property: connectionString
      - key: DB_CONNECTION
        value: pgsql
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: PAYMENT_PROVIDER
        value: diamanopay
      - key: PAYMENT_DEFAULT_CURRENCY
        value: XOF
      - key: DIAMANOPAY_BASE_URL
        sync: false
      - key: DIAMANOPAY_CLIENT_ID
        sync: false
      - key: DIAMANOPAY_CLIENT_SECRET
        sync: false
      - key: DIAMANOPAY_ACCESS_TOKEN
        sync: false
      - key: DIAMANOPAY_WEBHOOK_SECRET
        sync: false
      - key: DIAMANOPAY_CALLBACK_URL
        sync: false

databases:
  - name: maximus-postgres
    plan: free
    databaseName: maximus
    user: maximus