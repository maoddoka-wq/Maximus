openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: stock
    description: Stock management operations
  - name: auth
    description: Employee authentication
  - name: transport
    description: Driver mobile location and availability
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: loginMaximus
      tags: [auth]
      summary: Start an employee cookie session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginInput"
      responses:
        "200":
          description: Authenticated employee; sets the maximus_session cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResponse"
        "401":
          description: Invalid credentials
  /auth/company-login/{slug}:
    post:
      operationId: loginToCompany
      tags: [auth]
      summary: Start a company-branded employee cookie session
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginInput"
      responses:
        "200":
          description: Authenticated employee; sets the maximus_session cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResponse"
        "401":
          description: Invalid credentials
  /auth/logout:
    post:
      operationId: logoutMaximus
      tags: [auth]
      summary: End an employee cookie session and clear its cookie
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Session ended and cookie cleared
  /transport/mobile/session:
    post:
      operationId: createTransportDriverMobileSession
      tags: [transport]
      summary: Exchange an employee cookie session for a scoped driver token
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverMobileSessionInput"
      responses:
        "201":
          description: Driver session created; token is returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverMobileSessionCreated"
        "403":
          description: Account is not linked to an active Transport driver
    get:
      operationId: getTransportDriverMobileSession
      tags: [transport]
      summary: Get the current driver's own mobile session status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current driver and GPS freshness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverMobileSessionStatus"
        "401":
          description: Invalid or expired driver token
    delete:
      operationId: revokeTransportDriverMobileSession
      tags: [transport]
      summary: Revoke the current driver's mobile token
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session revoked
        "401":
          description: Invalid or expired driver token
  /transport/mobile/location:
    patch:
      operationId: updateTransportDriverMobileLocation
      tags: [transport]
      summary: Submit the authenticated driver's current GPS position
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverMobileLocationInput"
      responses:
        "200":
          description: Position accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverMobileLocationReceipt"
        "401":
          description: Invalid or expired driver token
        "422":
          description: Position is invalid, stale, inaccurate, or outside Dakar
  /transport/mobile/availability:
    patch:
      operationId: updateTransportDriverMobileAvailability
      tags: [transport]
      summary: Set the authenticated driver's own availability
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverMobileAvailabilityInput"
      responses:
        "200":
          description: Availability updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverMobileSessionStatus"
        "401":
          description: Invalid or expired driver token
        "422":
          description: Driver must have a fresh GPS position or finish the active trip
  /transport/mobile/trips:
    get:
      operationId: getTransportDriverMobileTrips
      tags: [transport]
      summary: List the authenticated driver's active, available, and historical trips
      security:
        - bearerAuth: []
      parameters:
        - name: historyPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: Driver-scoped trips and one page of trip history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverMobileTrips"
        "401":
          description: Invalid or expired driver token
  /transport/mobile/trips/{id}/accept:
    post:
      operationId: acceptTransportDriverMobileTrip
      tags: [transport]
      summary: Accept an available request or an offer assigned to the authenticated driver
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Trip accepted and assigned to the driver's available vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverMobileTrip"
        "401":
          description: Invalid or expired driver token
        "403":
          description: Trip is assigned to another driver
        "404":
          description: Trip not found in the driver's company
        "422":
          description: Trip, driver, or vehicle is no longer available
  /transport/mobile/trips/{id}/decline:
    post:
      operationId: declineTransportDriverMobileTrip
      tags: [transport]
      summary: Decline an offer assigned to the authenticated driver
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Offer released back to the available trip queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverMobileActionReceipt"
        "401":
          description: Invalid or expired driver token
        "403":
          description: Offer is not assigned to this driver
        "404":
          description: Trip not found in the driver's company
        "422":
          description: Offer is no longer active
  /transport/mobile/trips/{id}/start:
    patch:
      operationId: startTransportDriverMobileTrip
      tags: [transport]
      summary: Start an assigned trip after validating its pickup code
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverMobileTripStartInput"
      responses:
        "200":
          description: Trip started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverMobileTrip"
        "401":
          description: Invalid or expired driver token
        "403":
          description: Trip is assigned to another driver
        "404":
          description: Trip not found in the driver's company
        "422":
          description: Pickup code is incorrect or trip cannot be started
  /transport/mobile/trips/{id}/complete:
    patch:
      operationId: completeTransportDriverMobileTrip
      tags: [transport]
      summary: Complete the authenticated driver's trip
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Trip completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverMobileTrip"
        "401":
          description: Invalid or expired driver token
        "403":
          description: Trip is assigned to another driver
        "404":
          description: Trip not found in the driver's company
        "422":
          description: Trip has not started or cannot be completed
  /stock/bootstrap:
    get:
      operationId: getStockBootstrap
      tags: [stock]
      summary: Load the stock workspace
      parameters:
        - name: companyId
          in: query
          required: false
          schema:
            type: string
            default: kora
      responses:
        "200":
          description: Stock workspace data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockBootstrap"
  /stock/products:
    post:
      operationId: createStockProduct
      tags: [stock]
      summary: Create a stock product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockProduct"
  /stock/products/{id}:
    patch:
      operationId: updateStockProduct
      tags: [stock]
      summary: Update a stock product
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockProductInput"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockProduct"
    delete:
      operationId: archiveStockProduct
      tags: [stock]
      summary: Archive a stock product
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Product archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockProduct"
  /stock/movements:
    post:
      operationId: createStockMovement
      tags: [stock]
      summary: Validate a stock movement atomically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockMovementInput"
      responses:
        "201":
          description: Movement validated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovement"
        "409":
          description: Insufficient stock
  /stock/inventories:
    post:
      operationId: createStockInventory
      tags: [stock]
      summary: Create a stock inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockInventoryInput"
      responses:
        "201":
          description: Inventory created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockInventory"
  /stock/inventories/{id}/validate:
    post:
      operationId: validateStockInventory
      tags: [stock]
      summary: Validate inventory and apply differences
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Inventory validated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockInventory"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: maximus_session
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthLoginInput:
      type: object
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
      required: [email, password]
    AuthLoginResponse:
      type: object
      additionalProperties: true
      properties:
        user:
          type: object
          additionalProperties: true
      required: [user]
    DriverMobileSessionInput:
      type: object
      additionalProperties: false
      properties:
        deviceName: { type: string, maxLength: 120 }
    DriverMobile:
      type: object
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        availability:
          type: string
          enum: [AVAILABLE, PAUSED, ON_TRIP]
        locationUpdatedAt: { type: ["string", "null"], format: date-time }
      required: [id, name, availability, locationUpdatedAt]
    DriverMobileSessionCreated:
      type: object
      additionalProperties: false
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
        driver:
          $ref: "#/components/schemas/DriverMobile"
      required: [accessToken, expiresAt, driver]
    DriverMobileSessionStatus:
      type: object
      additionalProperties: false
      properties:
        driver:
          $ref: "#/components/schemas/DriverMobile"
      required: [driver]
    DriverMobileLocationInput:
      type: object
      additionalProperties: false
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracy: { type: number, minimum: 0, maximum: 1000 }
        capturedAt: { type: string, format: date-time }
      required: [latitude, longitude, accuracy, capturedAt]
    DriverMobileLocationReceipt:
      type: object
      additionalProperties: false
      properties:
        ok: { type: boolean, const: true }
        receivedAt: { type: string, format: date-time }
      required: [ok, receivedAt]
    DriverMobileAvailabilityInput:
      type: object
      additionalProperties: false
      properties:
        availability:
          type: string
          enum: [AVAILABLE, PAUSED]
      required: [availability]
    DriverMobileTrips:
      type: object
      additionalProperties: false
      properties:
        activeTrips:
          type: array
          items:
            $ref: "#/components/schemas/DriverMobileTrip"
        availableTrips:
          type: array
          items:
            $ref: "#/components/schemas/DriverMobileTrip"
        history:
          type: array
          items:
            $ref: "#/components/schemas/DriverMobileTrip"
        historyPage: { type: integer, minimum: 1 }
        historyHasMore: { type: boolean }
      required: [activeTrips, availableTrips, history, historyPage, historyHasMore]
    DriverMobileTrip:
      type: object
      additionalProperties: false
      properties:
        id: { type: string }
        reference: { type: string }
        pickup: { type: string }
        destination: { type: string }
        passengerName: { type: ["string", "null"] }
        passengerPhone: { type: ["string", "null"] }
        fare: { type: integer, minimum: 0 }
        status:
          type: string
          enum: [REQUESTED, OFFERED, ASSIGNED, IN_PROGRESS, COMPLETED, CANCELLED]
        requestedAt: { type: string, format: date-time }
        offerExpiresAt: { type: ["string", "null"], format: date-time }
        pickupCodeRequired: { type: boolean }
        assignedAt: { type: ["string", "null"], format: date-time }
        startedAt: { type: ["string", "null"], format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        updatedAt: { type: ["string", "null"], format: date-time }
        vehicleModel: { type: ["string", "null"] }
        vehicleRegistration: { type: ["string", "null"] }
      required:
        - id
        - reference
        - pickup
        - destination
        - passengerName
        - passengerPhone
        - fare
        - status
        - requestedAt
        - offerExpiresAt
        - pickupCodeRequired
        - assignedAt
        - startedAt
        - completedAt
        - updatedAt
        - vehicleModel
        - vehicleRegistration
    DriverMobileTripStartInput:
      type: object
      additionalProperties: false
      properties:
        pickupCode: { type: ["string", "null"], minLength: 4, maxLength: 4 }
    DriverMobileActionReceipt:
      type: object
      additionalProperties: false
      properties:
        ok: { type: boolean, const: true }
      required: [ok]
    StockProduct:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        companyId: { type: string }
        name: { type: string }
        sku: { type: string }
      required: [id, companyId, name, sku]
    StockProductInput:
      type: object
      additionalProperties: true
      properties:
        companyId: { type: string }
        name: { type: string }
        sku: { type: string }
      required: [name, sku]
    StockMovement:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        companyId: { type: string }
        productId: { type: string }
        warehouseId: { type: string }
        type: { type: string }
        quantity: { type: integer }
      required: [id, companyId, productId, warehouseId, type, quantity]
    StockMovementInput:
      type: object
      additionalProperties: true
      properties:
        companyId: { type: string }
        productId: { type: string }
        warehouseId: { type: string }
        type: { type: string }
        quantity: { type: integer, minimum: 1 }
      required: [productId, warehouseId, type, quantity]
    StockInventory:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        companyId: { type: string }
        warehouseId: { type: string }
        status: { type: string }
      required: [id, companyId, warehouseId, status]
    StockInventoryInput:
      type: object
      additionalProperties: true
      properties:
        companyId: { type: string }
        warehouseId: { type: string }
        notes: { type: string }
        lines:
          type: array
          items:
            type: object
            required: [productId, actualQuantity]
            properties:
              productId: { type: string }
              actualQuantity: { type: integer, minimum: 0 }
      required: [warehouseId, lines]
    StockBootstrap:
      type: object
      additionalProperties: true
      properties:
        products: { type: array, items: { $ref: "#/components/schemas/StockProduct" } }
        warehouses: { type: array, items: { type: object, additionalProperties: true } }
        locations: { type: array, items: { type: object, additionalProperties: true } }
        suppliers: { type: array, items: { type: object, additionalProperties: true } }
        balances: { type: array, items: { type: object, additionalProperties: true } }
        movements: { type: array, items: { $ref: "#/components/schemas/StockMovement" } }
        inventories: { type: array, items: { $ref: "#/components/schemas/StockInventory" } }
        inventoryLines: { type: array, items: { type: object, additionalProperties: true } }
      required: [products, warehouses, locations, suppliers, balances, movements, inventories, inventoryLines]

