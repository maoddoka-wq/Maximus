kind = "video"
videoAspectRatio = "9:16"
previewPath = "/maximus-erp-promo/"
title = "MAXIMUS — Film publicitaire"
description = "Film publicitaire vertical en français présentant les modules du logiciel MAXIMUS ERP, avec narration et musique originale."
version = "1.0.0"
id = "artifacts/maximus-erp-promo"
router = "path"

[[services]]
name = "web"
paths = [ "/maximus-erp-promo/" ]
localPort = 19695

[services.development]
run = "pnpm --filter @workspace/maximus-erp-promo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/maximus-erp-promo", "run", "build" ]
serve = "static"
publicDir = "artifacts/maximus-erp-promo/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19695"
BASE_PATH = "/maximus-erp-promo/"
