kind = "video"
previewPath = "/maximus-commerce-sales-video/"
videoAspectRatio = "9:16"
title = "MAXIMUS — Vidéo commerciale verticale"
description = "Film animé vertical de présentation commerciale MAXIMUS pour les commerçants, mettant en scène la boutique publique, la caisse comptoir, le suivi des commandes et les rapports."
version = "1.0.0"
id = "artifacts/maximus-commerce-sales-video"
router = "path"

[[services]]
name = "web"
paths = [ "/maximus-commerce-sales-video/" ]
localPort = 25594

[services.development]
run = "pnpm --filter @workspace/maximus-commerce-sales-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/maximus-commerce-sales-video", "run", "build" ]
serve = "static"
publicDir = "artifacts/maximus-commerce-sales-video/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25594"
BASE_PATH = "/maximus-commerce-sales-video/"
