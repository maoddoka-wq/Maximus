kind = "slides"
previewPath = "/maximus-presentation/"
title = "MAXIMUS ERP — Présentation des modules"
description = "Vue d’ensemble générale des modules actuellement disponibles dans MAXIMUS ERP : gestion commerciale, e-commerce, stock, immobilier, présences et paie."
version = "1.0.0"
id = "artifacts/maximus-nsg-presentation"
router = "path"

[[services]]
name = "web"
paths = [ "/maximus-presentation/" ]
localPort = 23301

[services.development]
run = "pnpm --filter @workspace/maximus-nsg-presentation run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/maximus-nsg-presentation", "run", "build" ]
serve = "static"
publicDir = "artifacts/maximus-nsg-presentation/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23301"
BASE_PATH = "/maximus-presentation/"