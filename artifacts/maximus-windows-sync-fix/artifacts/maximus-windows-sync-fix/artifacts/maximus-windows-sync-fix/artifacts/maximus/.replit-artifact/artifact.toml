kind = "web"
previewPath = "/"
title = "MAXIMUS ERP"
description = "Prototype web interactif d’un ERP SaaS multi-entreprises en français, avec administration, modules, dépendances, organisation, utilisateurs, permissions et modules métier préconfigurés pour KORA Entreprise."
version = "1.0.0"
id = "artifacts/maximus"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19624

[services.development]
run = "pnpm --filter @workspace/maximus run dev"

[services.production]
serve = "static"
publicDir = "artifacts/maximus/dist/public"

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/maximus", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"
PORT = "19624"
BASE_PATH = "/"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19624"
BASE_PATH = "/"
