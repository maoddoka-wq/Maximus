name: MAXIMUS Chauffeur Android release

on:
  push:
    tags:
      - "chauffeur-v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools, platforms;android-36, build-tools;36.0.0

      - name: Validate release tag and Android signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#chauffeur-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use chauffeur-vMAJOR.MINOR.PATCH."
            exit 1
          fi

          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Required GitHub Actions secret is missing: $name"
              exit 1
            fi
          done

          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Set the Android release version
        working-directory: artifacts/maximus-chauffeur
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'app.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          const versionCode = Number(process.env.GITHUB_RUN_NUMBER);
          if (!Number.isSafeInteger(versionCode) || versionCode < 1) {
            throw new Error('GitHub Actions provided an invalid Android version code.');
          }
          config.expo.version = process.env.RELEASE_VERSION;
          config.expo.android.versionCode = versionCode;
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Generate Android project
        working-directory: artifacts/maximus-chauffeur
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: artifacts/maximus-chauffeur/android
        run: ./gradlew --no-daemon assembleRelease

      - name: Sign APK with the stable release key
        id: sign_apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: artifacts/maximus-chauffeur/android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Name the APK asset
        env:
          SIGNED_APK: ${{ steps.sign_apk.outputs.signedReleaseFile }}
        run: |
          test -n "$SIGNED_APK"
          test -f "$SIGNED_APK"
          mkdir -p artifacts/maximus-chauffeur/dist
          cp "$SIGNED_APK" artifacts/maximus-chauffeur/dist/maximus-chauffeur.apk

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: MAXIMUS Chauffeur ${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          files: artifacts/maximus-chauffeur/dist/maximus-chauffeur.apk